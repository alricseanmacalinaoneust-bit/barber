<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Renz Barbershop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/login.css">
</head>

<body class="login-page">
  <main class="login-layout">
    <section class="login-brand">
      <div class="brand-icon">✂</div>
      <h1>RENZ <br>BARBERSHOP</h1>
      <p>Your style. Your turn. Your time.</p>
      <p>Join the queue in a few steps, or sign in to run the shop.</p>
    </section>

    <section class="login-content">
      <h2 id="formTitle">Welcome!</h2>
      <p class="login-subtitle" id="formSubtitle">Join the queue or sign in to your account.</p>

      <div class="device-notice hidden" id="deviceNotice" role="status"></div>

      <div class="login-tabs">
        <button class="login-tab active" id="customerTab" type="button">Customer</button>
        <button class="login-tab" id="staffTab" type="button">Staff</button>
      </div>

      <div id="customerPanel">
        <form id="guestForm" class="login-form">
          <label for="guestName">Your Name</label>
          <input id="guestName" type="text" minlength="2" maxlength="60" autocomplete="name" placeholder="Enter your name" required>
          <button class="login-submit" type="submit">Join the Queue</button>
          <p class="login-alt">
            No account needed. Have one?
            <button class="link-btn" type="button" data-form="customerLoginForm">Sign in</button>
          </p>
        </form>

        <form id="customerLoginForm" class="login-form" hidden>
          <label for="customerEmail">Email</label>
          <input id="customerEmail" type="email" autocomplete="username" placeholder="you@example.com" required>
          <label for="customerPassword">Password</label>
          <input id="customerPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="login-submit" type="submit">Sign In</button>
          <p class="login-alt">
            <button class="link-btn" type="button" data-form="guestForm">← Join without an account</button> ·
            <button class="link-btn" type="button" data-form="registerForm">Create an account</button>
          </p>
        </form>

        <form id="registerForm" class="login-form" hidden>
          <label for="registerName">Name</label>
          <input id="registerName" type="text" minlength="2" maxlength="60" autocomplete="name" required>
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" autocomplete="email" required>
          <label for="registerPhone">Phone (optional)</label>
          <input id="registerPhone" type="tel" maxlength="20" autocomplete="tel">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters, letters and numbers" required>
          <button class="login-submit" type="submit">Create Account</button>
          <p class="login-alt">
            <button class="link-btn" type="button" data-form="guestForm">← Join without an account</button>
          </p>
        </form>
      </div>

      <form id="staffForm" class="login-form" hidden>
        <label for="staffEmail">Staff Email</label>
        <input id="staffEmail" type="email" autocomplete="username" placeholder="name@renzbarbershop.com" required>
        <label for="staffPassword">Password</label>
        <input id="staffPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button class="login-submit" type="submit">Sign In</button>
      </form>

      <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      <p class="login-note" id="loginNote"></p>
    </section>
  </main>

  <script src="/js/common.js" defer></script>
  <script src="/js/login.js" defer></script>
</body>
</html>
