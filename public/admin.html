<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Renz Barbershop</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">✂</div>
      <div>
        <h2>RENZ</h2>
        <small>BARBERSHOP</small>
      </div>
    </div>

    <p class="menu-title">ADMIN MENU</p>

    <nav class="nav" aria-label="Admin navigation">
      <button class="nav-link" data-page="analytics" type="button"><span>▥</span> Analytics</button>
      <button class="nav-link" data-page="desk" type="button"><span>▤</span> Front Desk</button>
      <button class="nav-link" data-page="payments" type="button"><span>₱</span> Payments &amp; Reports</button>
      <button class="nav-link" data-page="customers" type="button"><span>◉</span> Customers</button>
      <button class="nav-link" data-page="barbers" type="button"><span>✂</span> Barbers</button>
      <button class="nav-link" data-page="services" type="button"><span>☰</span> Services</button>
      <button class="nav-link" data-page="inventory" type="button"><span>▣</span> Inventory</button>
      <button class="nav-link" data-page="staff" type="button"><span>♙</span> Staff</button>
      <button class="nav-link" data-page="activity" type="button"><span>◷</span> Activity Log</button>
      <button class="nav-link" data-page="account" type="button"><span>⚙</span> My Account</button>
      <button class="nav-link" id="logoutBtn" type="button"><span>↪</span> Log Out</button>
    </nav>

    <div class="sidebar-bottom">
      Admin dashboard<br>Your style. Your turn. Your time.
    </div>
  </aside>

  <div class="page">
    <header class="topbar">
      <h2 id="pageTitle">Analytics</h2>
      <span class="greeting" id="userGreeting">Hi</span>
    </header>

    <div class="banner hidden" id="passwordBanner">
      You're using a temporary password. <button class="text-btn" type="button" data-open-account>Change it now</button>
    </div>

    <main class="container" id="pageContent"></main>

    <footer>RENZ BARBERSHOP | ADMIN DASHBOARD</footer>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/desk.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
