<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Screen | Renz Barbershop</title>

  <link rel="stylesheet" href="/css/app.css">
</head>

<body class="display-page">
  <header class="display-header">
    <div class="display-brand"><span>✂</span> RENZ BARBERSHOP</div>
    <div class="display-clock" id="clock"></div>
  </header>

  <main class="display-main">
    <section class="display-panel">
      <h2>NOW SERVING</h2>
      <div class="display-serving" id="servingList"></div>
    </section>

    <section class="display-panel">
      <h2>NEXT IN LINE</h2>
      <div class="display-waiting" id="waitingList"></div>
      <p class="display-info" id="waitInfo"></p>
    </section>
  </main>

  <footer>JOIN THE QUEUE AT THE COUNTER OR ON YOUR PHONE | YOUR STYLE. YOUR TURN. YOUR TIME.</footer>

  <script src="/js/common.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
